# Cliente NTP del laboratorio (rol cliente).
# Sincroniza contra el gateway 192.168.50.1 (chrony local stratum 10).
server 192.168.50.1 iburst

# Fuentes adicionales desde DHCP (solo-anfitrión no entrega NTP).
sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d

keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony

logdir /var/log/chrony

maxupdateskew 100.0
rtcsync
makestep 1 3
leapsectz right/UTC
